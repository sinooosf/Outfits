<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#060606" />
    <title>Outsino</title>
    <script>
      // Apply the saved theme and language before first paint (no flash). Safe if storage is blocked.
      try {
        var t = JSON.parse(localStorage.getItem('outfit:theme'))
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
      try {
        var l = JSON.parse(localStorage.getItem('outfit:lang'))
        if (l === 'en' || l === 'fr' || l === 'ar') {
          document.documentElement.lang = l
          document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
